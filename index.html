const clone=o=>JSON.parse(JSON.stringify(o));
function pickItem(x,y){

function mergeItems(a,b,rm){

  b.forEach(j=>{if(!seen.has(j.id))out.push(j)});

/* [P3/توافق] تطبيع يقبل أي كائن حالة (محلي أو سحابي أو نسخة احتياطية) ويعيده؛ لا يضيف updatedAt/at/spType إن غابت

function norm(o){
  o=o||st;
  const S=o.setup=(o.setup&&typeof o.setup==='object')?o.setup:{};
  if(!Array.isArray(S.days)||S.days.length!==7)S.days=[4,4,4,4,4,0,5];
  if(!S.pg3)S.pg3=12;
  if(!Array.isArray(o.subjects))o.subjects=[];
  o.subjects=o.subjects.filter(s=>s&&typeof s==='object');
  const fin=(x,k)=>{if(x[k]!=null){const v=+x[k];if(Number.isFinite(v)&&v>=0)x[k]=v;else delete x[k]}};
  o.subjects.forEach(s=>{
    ['videos','sheets','exams'].forEach(k=>{
      s[k]=Array.isArray(s[k])?s[k].filter(i=>i&&typeof i==='object'):[];
      s[k].forEach(i=>{fin(i,'updatedAt');if(i.np!=null){const v=Math.round(+i.np);if(v>0&&v<=1000)i.np=v;else delete i.np}});
    });
    /* [E3] ترقية: الامتحان القديم بلا safety يأخذ قيمة نوعه القديمة فلا تتغير خطته؛ والقيم تُقيَّد بين 0 و7 */
    s.exams.forEach(e=>{if(!Array.isArray(e.sc))e.sc=[...(TY[e.t]||TY.midterm).scope];
      if(e.safety==null||e.safety===''||!Number.isFinite(+e.safety))e.safety=LEG_SAFETY[e.t]!=null?LEG_SAFETY[e.t]:SAFETY_DEF;else e.safety=clamp(Math.round(+e.safety),0,SAFETY_MAX)});
    /* [E8] ساعات الشيت التقديرية eh: موجبة وإلا تُزال */
    s.sheets.forEach(x=>{if(x.eh!=null){const v=+x.eh;if(Number.isFinite(v)&&v>0)x.eh=Math.min(v,500);else delete x.eh}});
    /* [E9] صعوبة المادة dif: 2 سهلة · 3 متوسطة · 4 صعبة · 5 صعبة جداً؛ غيرها = تلقائي */
    if(s.dif!=null){const v=Math.round(+s.dif);if([2,3,4,5].includes(v))s.dif=v;else delete s.dif}
    if(!/^#[0-9a-f]{3,8}$/i.test(s.color||''))s.color=COL[0];
    fin(s,'updatedAt');
    if(s.rm!=null){
      if(typeof s.rm==='object'&&!Array.isArray(s.rm))Object.keys(s.rm).forEach(k=>{const v=+s.rm[k];if(Number.isFinite(v))s.rm[k]=v;else delete s.rm[k]});
      else delete s.rm;
    }
  });
  if(!Array.isArray(o.dead))o.dead=[];
  if(!o.log||typeof o.log!=='object')o.log={};
  if(!o.freeLog||typeof o.freeLog!=='object')o.freeLog={};
  Object.entries(o.log).forEach(([k,e])=>{
    if(!e||typeof e!=='object'){delete o.log[k];return}
    if(e.sp!=null){const v=+e.sp;if(v>0&&Number.isFinite(v))e.sp=clamp(v,.5,2.5);else{delete e.sp;delete e.spType}}
    if(e.sp&&e.spType!=null&&!hasT(e.spType))delete e.spType;
    if(e.sp&&!e.spType){const ty=typeOfLogId(k,o.subjects);if(ty)e.spType=ty} /* استدلال من مصدر السجل؛ إن تعذّر يبقى بلا نوع */
  });
  Object.values(o.freeLog).forEach(f=>{if(f&&typeof f==='object')fin(f,'at')});
  /* [29] ترقية norm: سجل الالتزام الفعلي {date,actualHours,capHours}، آخر 30 يوماً */
  o.actualDays=(Array.isArray(o.actualDays)?o.actualDays:[]).filter(x=>x&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&Number.isFinite(+x.actualHours)&&+x.actualHours>=0).map(x=>({date:x.date,actualHours:+x.actualHours,capHours:Math.max(0,+x.capHours||0)})).slice(-30);
  if(!/^\d{4}-\d\d-\d\d$/.test(o.capResetAt||''))delete o.capResetAt; /* [31] تاريخ آخر «تجاهل» */
  /* [E6/E7] تركيز الأسبوع وخطة التعافي: تُقبل بشكلها الصحيح فقط */
  const isD=x=>/^\d{4}-\d\d-\d\d$/.test(x||'');
  if(o.focus!=null&&!(typeof o.focus==='object'&&typeof o.focus.sid==='string'&&isD(o.focus.until)))delete o.focus;
  if(o.recovery!=null&&!(typeof o.recovery==='object'&&Array.isArray(o.recovery.ids)&&isD(o.recovery.from)&&isD(o.recovery.until)))delete o.recovery;
  if(!(o.v>=2))o.v=2;
  return o;
}

const typeOfLogId=(id,subs)=>{

/* [P5] calcSpd: لكل نوع آخر 10 تقييمات من نوعه فقط، بمتوسط مُقلَّص نحو 1 بوزن SPD_K (عينة واحدة لا تقفز بالمعامل)،
   وحدّان [0.6, 2]. التقييم الأبطأ (>1) يرفع الوقت والأسرع (<1) يخفضه. تعيد المتوسط العام وتحدّث SPD_BY_TYPE. */
function calcSpd(){

  Object.entries(st.log).forEach(([k,e])=>{

  Object.keys(by).forEach(t=>{SPD_BY_TYPE[t]=avg(by[t])});

}

function recActual(){

  src.forEach((x,i)=>{ad.push(x);const nx=i+1<src.length?src[i+1].date:t0,g=diff(x.date,nx)-1;if(g>=1&&g<=7)for(let k=1;k<=g;k++){const d=add(x.date,k);if(cp(d)>0)ad.push({date:d,actualHours:0,capHours:cp(d)})}});

/* [P5] الفيديوهات تتأثر بمعامل الفيديو فقط، والشيتات بمعامل الشيتات (عبر minPerPage) */
function units(s){
  const U=[],vk=SPD_BY_TYPE.video;
  s.videos.forEach(v=>U.push({id:v.id,sid:s.id,p:v.p,k:'v',t:v.n,h:Math.max(.25,v.h*vk),d:s.dif>0?s.dif:3,np:v.np,cv:v.cv}));
  /* [28] الشيت المغطّى كاملاً بفيديوهات منجزة لا مهمة له (ما لم تكن له سجلات سابقة فيبقى لحفظ مراجعاته)؛ والمغطّى جزئياً تنكمش صفحاته */
  s.sheets.forEach(x=>{const pg=Math.max(0,x.pg-coveredPages(s,x.id));if(!pg&&!Object.keys(st.log).some(k=>k[0]==='L'&&k.slice(1).replace(/~\d+$/,'')===x.id))return;const d=difOf(s,x);U.push({id:x.id,sid:s.id,p:x.p,k:'s',t:x.n,h:Math.max(.25,pg*sheetMpp(x,d)/60),d,pg,np:x.np})});
  return U;
}
/* [P4] التقسيم الآمن: حجم الجزء ≤ min(ساعة، أكبر سعة يومية فعلية) وبحد أدنى 0.25 س وسقف MAXP جزء.
   الأجزاء المثبّتة (np) تحتفظ بمعرّفاتها؛ ولا يزيد عددها إلا إذا كبر الجزء عن السعة (تُضاف أجزاء بمعرّفات جديدة بعد الموجودة،
   فلا تضيع سجلات الأجزاء القديمة). */
const MINPART=.25,MAXP=400;
const maxDayCap=()=>Math.max(0,...st.setup.days.map(x=>+x||0))*RESERVE;
const chunkH=()=>{const m=maxDayCap();return m>=PART?PART:Math.max(MINPART,Math.floor(m*4+1e-9)/4)};
const nParts=u=>{const ch=chunkH(),need=clamp(Math.ceil(u.h/ch-1e-9),1,MAXP);return u.np>0?(u.h/u.np>ch+1e-9?Math.max(u.np,need):u.np):need};
const parts=u=>{const n=nParts(u);return Array.from({length:n},(_,i)=>({id:'L'+u.id+(n>1?'~'+i:''),t:n>1?u.t+' ('+(i+1)+'/'+n+')':u.t,h:u.h/n,k:u.k,cv:u.cv,pg:u.pg>0?Math.max(1,Math.round(u.pg/n)):0}))};
const freeze=bid=>st.subjects.forEach(s=>{const it=s.videos.concat(s.sheets).find(x=>x.id===bid);if(it&&!it.np){const u=units(s).find(x=>x.id===bid);if(u)it.np=parts(u).length}});
const doneOn=u=>{const f=st.log['L'+u.id];if(f&&f.s==='done')return f.on;const ls=parts(u).map(p=>st.log[p.id]);return ls.every(l=>l&&l.s==='done')?ls.reduce((m,l)=>l.on>m?l.on:m,''):null};

function horizon(t0){
  let last='';
  st.subjects.forEach(s=>s.exams.forEach(e=>{if(e.date>=t0&&e.date>last)last=e.date}));
  return last||add(t0,28);
}
/* [P5] وقت المراجعة يستخدم معامل المراجعات */
const revH=h=>Math.min(1,q25(h*.15*SPD_BY_TYPE.review));
/* [P2] موضوع مراجعة مستقل لكل جزء مكتمل فعلاً (p.id معرّفاً، p.t عنواناً، مع partIdx/totalParts) دون انتظار بقية الوحدة.
   legacy=u.id للاستفادة من سلاسل المراجعة القديمة المبنية على معرّف الوحدة. الدراسة الحرة كما هي. */
function topics(){
  const T=[];
  st.subjects.forEach(s=>units(s).forEach(u=>{
    const w=st.log['L'+u.id],ps=parts(u);
    if(w&&w.s==='done'){T.push({key:'L'+u.id,legacy:u.id,base:w.on,title:u.t,h:u.h,sid:s.id,free:false,partIdx:0,totalParts:1,unit:u.id});return}
    ps.forEach((p,i)=>{const l=st.log[p.id];if(l&&l.s==='done')T.push({key:p.id,legacy:u.id,base:l.on,title:p.t,h:p.h,sid:s.id,free:false,partIdx:i,totalParts:ps.length,unit:u.id})});
  }));
  Object.entries(st.freeLog).forEach(([id,f])=>{if(sub(f.sid))T.push({key:'F'+id,legacy:null,base:f.on,title:f.title,h:f.hours,sid:f.sid,free:true,partIdx:0,totalParts:1})});
  return T;
}
/* سلسلة مراجعة لكل موضوع: الموعد التالي يُحسب من آخر مراجعة فعلية ونتيجتها.
   جيد: مستوى+1 · سهل: مستوى+2 · صعب: نفس المستوى بفاصل أقصر · نسيت: يرجع للبداية.
   [P2] legacy: تُقرأ سجلات المراجعة القديمة (R+معرّف الوحدة) إن لم يوجد سجل بالمفتاح الجديد، فلا تبدأ السلسلة من جديد */
function chain(base,key,legacy){
  let L=0,due=add(base,GAP[0]);
  for(let j=0;j<12;j++){
    const id='R'+key+'_'+j,e=st.log[id]||(legacy?st.log['R'+legacy+'_'+j]:null);
    if(e&&e.s==='done'){
      const r=e.r||'good';
      L=r==='forgot'?0:r==='hard'?L:r==='easy'?L+2:L+1;
      if(L>=GAP.length)return{level:L,mastered:true};
      due=add(e.on,r==='hard'?Math.max(1,Math.round(GAP[L]*.6)):GAP[L]);

const isDone=id=>(st.log[id]||{}).s==='done';
const CUMGAP=GAP.reduce((a,g)=>{a.push((a.length?a[a.length-1]:0)+g);return a},[]);

const studyDl=(e,t0)=>{const d=add(e.date,-safetyDays(null,e));return d<t0?t0:d};
/* [E5] ساعات الجزء المنجز: الدقائق الفعلية m إن سُجّلت، وإلا المقدّر ناقص ما أُنجز في يوم سابق (pd) */
const usedH=(h,l)=>l&&l.m!=null?Math.max(0,+l.m||0)/60:Math.max(0,h-((l&&l.pd)||0)/60);
/* دقائق الجزئي في يومه فقط (dt)، مع الرجوع للقديم dm */
const dtOf=l=>l&&l.s==='part'?(l.dt!=null?(+l.dt||0):(+l.dm||0)):0;
/* ساعات أُنجزت في يوم معيّن (أجزاء + مهام أمان + دراسة حرة + دقائق الجزئي): تُخصم من سعة اليوم.
   [E2] المراجعات تذكير خارج السعة فلا تُحسب هنا */
const usedOn=d0=>{
  let h=0;
  st.subjects.forEach(s=>units(s).forEach(u=>{
    const w=st.log['L'+u.id];if(w&&w.s==='done'){if(w.on===d0)h+=usedH(u.h,w);return}
    parts(u).forEach(p=>{const l=st.log[p.id];if(l&&l.s==='done'&&l.on===d0)h+=usedH(p.h,l)});
  }));
  Object.entries(st.log).forEach(([k,e])=>{if(k[0]==='S'&&e.s==='done'&&e.on===d0)h+=e.h||0;else if(e.s==='part'&&e.on===d0)h+=dtOf(e)/60});

/* مراجعات موضوع متوقعة حتى موعد dl بافتراض تقييم «جيد» */
function revUntil(T,dl,t0){
  const c=chain(T.base,T.key,T.legacy);if(c.mastered)return 0;

  while(L<GAP.length&&due<=dl){n++;L++;if(L<GAP.length)due=add(due,GAP[L])}

/* [E2/E4] الجدوى العامة: المراجعات تذكير خارج السعة فلا تدخل في الحاجة؛ الحاجة = ساعات التعلّم المتبقية فقط.
   rest = ساعات الدراسة المتبقية (للتوافق)، و rev = 0 دائماً */
function feasibility(t0){
  let study=0;
  st.subjects.forEach(s=>units(s).forEach(u=>{
    if(doneOn(u))return;
    parts(u).forEach(p=>{if(!isDone(p.id))study+=p.h});
  }));
  const last=horizon(t0);let avail=0;
  for(let d=t0;d<last;d=add(d,1))avail+=capOf(d);

  return{ok,allOk:ok,need,avail,deficit:Math.max(0,need-avail),days:Math.max(1,diff(t0,last)),rest:study,study,rev:0,last};

/* [P2] المراجعات تُبنى من موضوعات الأجزاء، وتحمل partIdx/totalParts */
function buildRevisions(t0){
  const R={};let mast=0,act=0;
  topics().forEach(T=>{
    const c=chain(T.base,T.key,T.legacy);
    if(c.mastered){mast++;return}
    act++;
    R[c.id]={sid:T.sid,due:c.due<t0?t0:c.due,due0:c.due,title:'مراجعة: '+T.title,hours:revH(T.h),stage:c.level+1,free:T.free,partIdx:T.partIdx,totalParts:T.totalParts};
  });

/* [E1-E12] makePlan: جدولة عادلة (حصة يومية لكل مادة وموعد + اختيار الأعلى أولوية)، المراجعات تذكير خارج الجدول (P.dueRevs)،
   أيام الأمان من e.safety فقط، التعلّم يأخذ كامل سعة اليوم، تركيز أسبوعي، خطة تعافٍ، وضمان ظهور كل المنهج في all أو uns.
   opt.sim/opt.extra: تشغيل تجريبي خفيف لمعرفة الساعات الإضافية اللازمة لإكمال المنهج (لا يغيّر الحالة). */

  all.filter(t=>t.st==='done'&&t.date===t0&&t.type!=='review').forEach(t=>dayOf(t0).used+=(t.uh!=null?t.uh:t.hours));

  /* [29] جدوى أيام الأمان لكل امتحان: إن زادت ساعات التعلّم عن 1.5× سعتها حتى موعد التعلّم فلا أيام أمان ويمتد التعلّم حتى ما قبل الامتحان */

  const CH=chunkH(),G={};learn.forEach(t=>{const k=t.sid+'|'+t.deadline;(G[k]=G[k]||{sid:t.sid,dl:t.deadline,tasks:[]}).tasks.push(t)});
  const gs=Object.values(G);gs.forEach(g=>g.tasks.sort((a,b)=>(b.d-a.d)||(a.seq-b.seq)));

  const nDays=(i,dl)=>{const e=dl>=last?list.length-1:(pos[dl]!=null?pos[dl]:list.length-1);let n=0;for(let j=i;j<=e;j++)if(list[j].cap-list[j].used>1e-9)n++;return Math.max(1,n)};

    /* 1) عند ضيق السعة: لكل مجموعة مهمة واحدة على الأقل بترتيب الأقرب موعداً حتى لا تتوقف مادة */
    if(ag.reduce((a,g)=>a+g.tg,0)>room()+1e-9)for(const g of ag){if(room()<.25-1e-9)break;const t=first(g,room());if(t)put(g,t)}
    /* 2) كل مجموعة تأخذ نصيبها دوراً بدور (الأقرب أولاً في كل دورة) */
    for(let mv=true;mv&&room()>=.25-1e-9;){mv=false;for(const g of ag){if(g.gv+1e-9>=g.tg)continue;const t=first(g,room());if(t){put(g,t);mv=true;if(room()<.25-1e-9)break}}}
    /* 3) ما تبقّى من السعة للمجموعة الأعلى وتيرة مطلوبة (الأكثر تأخراً)، فيمتلئ اليوم بالتعلّم كاملاً */
    while(room()>=.25-1e-9){
      let bg=null,bt=null,bp=-1;
      for(const g of ag){const t=first(g,room());if(!t)continue;const p=left(g)/g.n*g.fw;if(p>bp+1e-9||(Math.abs(p-bp)<=1e-9&&bg&&g.dl<bg.dl)){bg=g;bt=t;bp=p}}
      if(!bt)break;put(bg,bt);
    }
  }
  const mc=maxDayCap(),uns=learn.filter(t=>!t.pl).map(t=>({...t,date:null,manual:t.hours>mc+1e-9}));
  /* المتأخر الحقيقي: يستثني ما بلا امتحان قادم وما هو أكبر من سعة أي يوم (يحتاج تعديلاً يدوياً) */
  const gapOf=()=>{const g=uns.filter(t=>!t.nx&&!t.manual);return{n:g.length,h:g.reduce((a,t)=>a+t.hours,0),ids:g.map(t=>t.id)}};
  if(sim){const g0=gapOf();return{gap:g0.h,nosf:noSfN.length}}
  all.push(...uns);
  /* [E12] ضمان: كل جزء غير منجز إمّا في all (مجدول) أو في uns؛ أي جزء مفقود يُضاف إلى uns */
  {const have=new Set(all.map(t=>t.id));
   st.subjects.forEach(s=>units(s).forEach(u=>{if(doneOn(u))return;parts(u).forEach(p=>{if(isDone(p.id)||have.has(p.id))return;const t={id:p.id,type:'learn',sid:s.id,title:p.t,hours:p.h,date:null,k:u.k,cv:p.cv,pg:p.pg,manual:p.h>mc+1e-9,missed:true};uns.push(t);all.push(t);have.add(p.id)})}))}
  /* [E11] نقص الوقت: الحل الوحيد زيادة الساعات؛ تُحسب أقل زيادة يومية (بخطوة نصف ساعة) تُكمل المنهج وتُبقي أيام الأمان */
  const gp=gapOf(),lt=learn.filter(t=>!t.nx),needH=lt.reduce((a,t)=>a+t.hours,0);
  let shortage=null;
  if(gp.h>1e-9||noSfN.length){
    const okAt=k=>{const q=makePlan(t0,{sim:true,extra:k/2});return !!q&&q.gap<=1e-9&&!q.nosf};
    let ex=null;
    if(okAt(16)){let lo=0,hi=16;while(hi-lo>1){const m=(lo+hi)>>1;if(okAt(m))hi=m;else lo=m}ex=hi/2}
    const wd=st.setup.days.filter(x=>x>0),avg=wd.length?wd.reduce((a,b)=>a+b,0)/wd.length:0;
    shortage={need:needH,have:needH-gp.h,gap:gp.h,extra:ex,w:ex==null?null:avg+ex};
  }
  /* [E2] المراجعات المستحقة اليوم تذكير منفصل (الأكثر تأخراً أولاً) ولا تدخل في all ولا تأخذ من السعة */
  const k0=r=>r.due0||r.due;
  const dueRevs=Object.entries(revs).filter(([,r])=>r.due<=t0).map(([id,r])=>({id,type:'review',...r,late:Math.max(0,diff(k0(r),t0))})).sort((a,b)=>k0(a)<k0(b)?-1:k0(a)>k0(b)?1:0);
  const upD=Object.values(revs).filter(r=>r.due>t0).map(r=>r.due).sort();
  return{all,uns,sfUns,noSf:noSfN,feas,revs,mast,act,days:Object.values(days).sort((a,b)=>a.date<b.date?-1:1),dueRevs,upN:upD.length,upFirst:upD[0]||'',shortage,late:{n:gp.n,h:gp.h,total:lt.length,ratio:lt.length?gp.n/lt.length:0,ids:gp.ids},rc,foc};
}

function streak(t0){
  const on=new Set(Object.values(st.log).filter(e=>e.s==='done').map(e=>e.on));
  Object.values(st.freeLog).forEach(f=>on.add(f.on));
  let d=on.has(t0)?t0:add(t0,-1),n=0;
  while(on.has(d)){n++;d=add(d,-1)}
  return n;
}

const dp=(attrs,v,id)=>`<span class="dp"><input type="text" inputmode="numeric" dir="ltr" maxlength="10" placeholder="DD/MM/YYYY" data-dt ${id?`id="${id}_t"`:''} value="${v?v.split('-').reverse().join('/'):''}">
  <span class="wrap">${ic('cal',19)}<input type="date" data-dn value="${v||''}"></span><input type="hidden" ${attrs} value="${v||''}"></span>`;
const setDt=(w,iso)=>{
  const[y,m,d]=iso.split('-').map(Number);
  if(!(y>=2000)||new Date(y,m-1,d).getMonth()!==m-1){msg('تاريخ غير صحيح.');return}
  const h=w.querySelector('input[type=hidden]');
  w.querySelector('[data-dt]').value=String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'/'+y;
  w.querySelector('[data-dn]').value=iso;
  if(h.value!==iso){h.value=iso;h.dispatchEvent(new Event('change',{bubbles:true}))}
};
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||t.dataset.dt===undefined)return;
  const d=t.value.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/\D/g,'').slice(0,8);
  t.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;
  if(d.length===8)setDt(t.closest('.dp'),d.slice(4)+'-'+d.slice(2,4)+'-'+d.slice(0,2));
},true);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.dn!==undefined){e.stopPropagation();if(t.value)setDt(t.closest('.dp'),t.value)}},true);

/* [E6/E10/E11] تنبيهات ظاهرة (ليست داخل details): نقص الوقت = زيادة الساعات فقط، تنبيه المتأخر، وعرض خطة التعافي عند تجاوز 20٪ */
const unsAlert=()=>{
  if(!P)return'';
  const sh=P.shortage,lt=P.late,rc=P.rc;let h='';
  if(rc){
    const n=clamp(diff(rc.from,today())+1,1,REC_DAYS);
    h+=ban('','repeat',`<b>🩹 خطة تعافٍ — اليوم ${n} من ${REC_DAYS}</b><br>لا تعلّم جديد؛ فقط إنجاز المهام المتأخرة، ثم تعود الخطة العادية.<br><button class="sm" data-a="recEnd" style="margin-top:6px">العودة للخطة العادية الآن</button>`);
  }
  if(sh&&sh.gap>1e-9){
    const btn=sh.extra!=null?`<button class="sm on" data-a="raiseHrs" data-x="${sh.extra}" style="margin-top:6px">${ic('plus',14)}ارفع ساعاتك إلى ${Math.round(sh.w*10)/10} ساعة/يوم</button>`
      :`<span class="mu">حتى مع +8 ساعات يومياً لا يكتمل قبل المواعيد.</span><br><button class="sm on" data-a="raiseHrs" data-x="8" style="margin-top:6px">${ic('plus',14)}ارفع ساعاتك +8 ساعات/يوم</button>`;
    h+=ban('warn','alert',`<b>⚠️ منهجك يحتاج ${formatDuration(sh.need)}، لديك ${formatDuration(sh.have)}.</b><br>الفرق: ${formatDuration(sh.gap)}.<br>${btn}`);
  }else if(P.uns.length){
    const tot=P.uns.reduce((a,t)=>a+t.hours,0);
    h+=ban('warn','alert',`<b>${P.uns.length} مهمة لم تتسع (${formatDuration(tot)})</b><br>تدخل الخطة كلما اتّسع وقتك.<br><button class="sm" data-a="raiseHrs" data-x="1" style="margin-top:6px">${ic('plus',14)}زيادة الساعات (+1 س لكل يوم دراسة)</button>`);
  }
  if(!rc&&lt&&lt.total>0&&lt.ratio>REC_RATIO){
    h+=ban('bad','alert',`<b>⚠️ ${lt.n} مهمة متأخرة (${formatDuration(lt.h)})</b><br>خطة التعافي: ${REC_DAYS} أيام لا تعلّم جديد فيها، فقط إنجاز المتأخر.<br><span class="row" style="margin-top:6px"><button class="sm on" data-a="recStart">خطة تعافٍ: ${REC_DAYS} أيام للتعافي</button><button class="sm" data-a="raiseHrs" data-x="${sh&&sh.extra!=null?sh.extra:1}">زيادة الساعات</button></span>`);
  }
  if(P.noSf.length)h+=ban('warn','alert','المنهج أكبر من الوقت. لا أيام أمان: '+esc(P.noSf.join('، '))+'.'+(sh&&sh.extra!=null&&!(sh.gap>1e-9)?`<br><button class="sm" data-a="raiseHrs" data-x="${sh.extra}" style="margin-top:6px">${ic('plus',14)}ارفع ساعاتك إلى ${Math.round(sh.w*10)/10} ساعة/يوم لتعود أيام الأمان</button>`:''));
  return h;
};

function vPlan(){
  if(!P)return `<h1>الخطة</h1><div class="card empty">${ic('cal',30)}<div>أضف مواد وفيديوهات وشيتات أولاً.</div></div>`;
  let h=`<h1>الخطة القادمة</h1>`+unsAlert()+unsH();
  P.days.slice(0,more).forEach(d=>{

/* ===== حفظ ومزامنة ===== */
function save(){
  recActual();ver++;st.t=Math.max(Date.now(),(st.t||0)+1);lsSet('mp3',st);pending=true;
  try{TG&&TG.enableClosingConfirmation&&CS&&TG.enableClosingConfirmation()}catch(e){}
  clearTimeout(tmr);tmr=setTimeout(push,800);
}
let seenP=''; /* آخر مؤشر حفظ (slot,count,checksum,t) شوهد في السحابة (قرأناه أو كتبناه): إن اختلف فالسحابة تغيّرت من جهاز آخر. المقارنة بالمؤشر الكامل لا بـ t وحده لأن t قد يتطابق على جهازين */
/* دمج آمن: عند أي استثناء يعيد null فلا تُكتب السحابة ولا تُفقد النسخة المحلية */
const smerge=(a,b)=>{try{return mergeSt(a,b)}catch(e){console.log(e);return null}};
/* [P3] push: يدمج النسخة السحابية قبل الكتابة كلما تغيّرت (m.p!==seenP) وليس فقط حين تكون أحدث بالوقت؛
   ولا يُعلن «متزامنة» إلا إذا انتهت الكتابة فعلاً (sync=!pending). فشل القراءة أو الدمج يُلغي الكتابة بدل الكتابة فوق السحابة. */
async function push(){
  if(!CS||noPush)return;
  if(busy){again=true;return}
  busy=true;
  try{
    let tries=0;
    do{
      again=false;if(++tries>3)break;
      const m=await cget(['p','q','n']);if(!m)throw 0;
      if(m.p&&m.p!==seenP){
        const r=await pull();if(!r.ok)throw 0;
        if(r.data){const mg=smerge(st,r.data);if(!mg)throw 0;st=mg;norm();prune();ver++;lsSet('mp3',st);keep=true;render()}
      }
      const j=await pack(JSON.stringify(st)),t0=st.t,c0=m.p?+m.p.split(',')[0]:1,nw=c0?0:1;
      const ch=j.match(/[\s\S]{1,2000}/g)||[],sum=CHK(j);
      for(let i=0;i<ch.length;i++)await cset('s'+nw+'_'+i,ch[i]);
      if(m.p)await cset('q',m.p);
      const np=nw+','+ch.length+','+sum+','+t0;
      await cset('p',np);
      seenP=np;
      const oq=m.q?+m.q.split(',')[1]:0,rm=[];
      for(let i=ch.length;i<oq;i++)rm.push('s'+nw+'_'+i);
      if(+m.n){rm.push('n');for(let i=0;i<+m.n;i++)rm.push('d'+i)}
      await crem(rm);
      if(st.t===t0&&!again)pending=false;
    }while(again);
    sync=!pending;
  }catch(e){sync=false}
  busy=false;
  if(!pending)try{TG&&TG.disableClosingConfirmation&&TG.disableClosingConfirmation()}catch(e){}
}
function flush(){clearTimeout(tmr);if(pending)push()}
/* [P3] resync: يدمج كلما تغيّرت السحابة (مؤشر الحفظ مختلف عمّا شوهد) لا فقط إن كان t أكبر (ساعات الأجهزة قد تختلف)،
   وإن كان الناتج يختلف عن السحابة يُدفع من جديد */
async function resync(){
  if(!CS||busy||(pending&&!noPush))return;
  const r=await pull();if(!r.ok)return;
  if(r.data&&r.p!==seenP){
    const mg=smerge(st,r.data);if(!mg)return;
    lsSet('mp3_prev',st);st=mg;norm();ver++;lsSet('mp3',st);seenP=r.p;noPush=false;pending=st.t!==r.data.t;render();if(pending)push();
  }
  else if(noPush){noPush=false;if(!r.data){pending=true;push()}}
}
document.addEventListener('visibilitychange',()=>document.hidden?flush():resync());
addEventListener('pagehide',flush);
if(TG){TG.onEvent('deactivated',flush);TG.onEvent('activated',resync)}

/* [P3/توافق] load: كل المصادر تمر بالتطبيع نفسه داخل mergeSt/norm؛ وفشل الدمج لا يمسح المحلي (يُحفظ الخاسر في mp3_prev) */
async function load(){
  const loc=lsGet('mp3');let r={ok:false};
  for(let i=0;i<3&&CS&&!r.ok;i++){r=await pull();if(!r.ok)await new Promise(x=>setTimeout(x,700))}
  const cl=r.data;let m0;
  if(loc&&cl){
    m0=smerge(loc,cl);
    if(!m0){const lw=(loc.t||0)>=(cl.t||0);m0=lw?loc:cl;lsSet('mp3_prev',lw?cl:loc)}
  }else m0=loc||cl||{};
  st={...dflt(),...m0};
  norm();prune();lsSet('mp3',st);
  if(r.ok&&cl)seenP=r.p;
  if(CS){if(!r.ok&&!loc)noPush=true;else if(loc&&(!cl||st.t!==cl.t))pending=true}
  try{const x=await fetch('config.json',{cache:'no-cache'});CFG={...CFG,...await x.json()};lsSet('cfg',CFG)}catch(e){CFG={...CFG,...(lsGet('cfg')||{})}}
  if(pending)push();
}

/* ===== الأفعال ===== */
/* [E2] تُبحث المهام المجدولة ثم المراجعات المستحقة (التي لا تدخل في all) */
const findT=id=>P&&(P.all.find(x=>x.id===id)||(P.dueRevs||[]).find(x=>x.id===id));
/* [P3] تحديث updatedAt للمادة/العنصر عند أي تعديل، وعلامة حذف rm للعناصر المحذوفة (تمنع عودتها عند الدمج) */
const tch=(s,it)=>{if(!s)return;const n=Date.now();s.updatedAt=Math.max(n,(s.updatedAt||0)+1);if(it)it.updatedAt=n};
const rmk=(s,id)=>{(s.rm=s.rm||{})[id]=Date.now()};
/* [P3/P2/P5] الإجراءات المعدّلة: addSub/scol/addVid/delVid/addSh/delSh/addEx/delEx/sc/quick (updatedAt وعلامات حذف rm)،
   skip (تثبيت عدد الأجزاء)، spd (تخزين spType)، freeSave (حقل at)؛ ومعالج change (تحديث updatedAt) */
const A={
  tab:d=>{view=d.t;sid=null;fo=false;tf=null},open:d=>{sid=d.id},back:()=>{sid=null},
  theme:()=>{st.theme=isDark()?'light':'dark';st.tc=1},
  logo:()=>{const n=Date.now();taps=taps.filter(t=>n-t<3000);taps.push(n);if(taps.length>=5){taps=[];view='admin';sid=null}},
  addSub:()=>{const n=val('nn').trim();if(!n){msg('اكتب اسم المادة.');return}st.subjects.push({id:uid(),name:n.slice(0,60),docs:+val('nd')||0,color:COL[st.subjects.length%COL.length],videos:[],sheets:[],exams:[],updatedAt:Date.now(),...([2,3,4,5].includes(+val('ndf'))?{dif:+val('ndf')}:{})})},
  delSub:()=>{const id=sid;ask('حذف المادة وكل بياناتها؟',()=>{st.subjects=st.subjects.filter(s=>s.id!==id);st.dead.push(id);sid=null;save();render()})},
  scol:d=>{cur().color=d.c;tch(cur())},edit:d=>{editId=editId===d.id?null:d.id},
  addVid:()=>{const n=val('vn').trim(),h=+val('vh');if(!n||!(h>0)){msg('اكتب الاسم والساعات.');return}const s=cur(),it={id:uid(),n:n.slice(0,80),h:Math.min(h,100),p:val('vp')};{const sh=val('vs'),a=Math.round(+val('vf')),b=Math.round(+val('vt'));if(sh&&a>0&&b>=a){it.sh=sh;it.cv=[a,b]}}s.videos.push(it);tch(s,it)},
  delVid:d=>{const s=cur();s.videos=s.videos.filter(v=>v.id!==d.id);rmk(s,d.id);tch(s)},
  addSh:()=>{const n=val('sn').trim(),pg=+val('sp');if(!n||!(pg>0)){msg('اكتب الاسم والصفحات.');return}const s=cur(),it={id:uid(),n:n.slice(0,80),pg:Math.min(Math.round(pg),5000),d:+val('sd')||0,p:val('shp')};if(+val('seh')>0)it.eh=Math.min(+val('seh'),500);s.sheets.push(it);tch(s,it)},
  delSh:d=>{const s=cur();s.sheets=s.sheets.filter(x=>x.id!==d.id);rmk(s,d.id);tch(s)},
  addEx:()=>{const t=val('et'),date=val('ed');if(!date){msg('اختر التاريخ.');return}const s=cur(),it={id:uid(),t,date,sc:[...TY[t].scope],safety:sfv('esf')};s.exams.push(it);tch(s,it)},
  delEx:d=>{const s=cur();s.exams=s.exams.filter(e=>e.id!==d.id);rmk(s,d.id);tch(s)},
  sc:d=>{const e=cur().exams.find(x=>x.id===d.id);e.sc=e.sc.includes(d.k)?e.sc.filter(k=>k!==d.k):[...e.sc,d.k];tch(cur(),e)},
  done:d=>{freeze(d.id.slice(1).replace(/~\d+$/,''));const t=findT(d.id),o=st.log[d.id];st.log[d.id]={s:'done',on:today(),at:Date.now(),...(t&&t.cv?{cv:t.cv}:{}),...(t&&t.type==='safe'?{h:t.hours}:{}),...(o&&o.s==='part'&&o.dm&&o.on!==today()?{pd:o.dm}:{})};toast('أُنجزت ✓') /* [29] يحفظ نطاق التغطية */},
  rate:d=>{
    const t=findT(d.id);if(!t)return;
    st.log[d.id]={s:'done',on:today(),at:Date.now(),r:d.r,t:t.title,h:t.hours,sid:t.sid,f:!!t.free};
    const key=d.id.slice(1,d.id.lastIndexOf('_')),nx=Object.entries(buildRevisions(today()).R).find(([k])=>k.startsWith('R'+key+'_'));
    toast(nx?'سُجّل ✓ المراجعة القادمة: '+sd(nx[1].due):'أتقنت هذا الموضوع ✓');
  },
  /* [P5] spd: يخزّن spType (sheet/video/review) من نوع المهمة المعروف في بياناتها لا من عنوانها */
  spd:d=>{const l=st.log[d.id];if(!l||!SPDV[d.r])return;const t=findT(d.id),ty=t?(t.type==='review'?'review':t.k==='v'?'video':'sheet'):typeOfLogId(d.id);l.sp=SPDV[d.r];if(ty)l.spType=ty;l.at=Date.now();toast('سُجّل ✓ سيتعلّم النظام سرعتك')},
  skip:d=>{freeze(d.id.slice(1).replace(/~\d+$/,''));const c=Object.values(st.log).filter(e=>e.s==='skip'&&e.on===today()).length;if(c>=3){msg('حد الترحيل اليوم: 3 مهام.');return}st.log[d.id]={s:'skip',on:today(),at:Date.now()};toast('رُحّلت إلى الغد')},
  undo:d=>{st.log[d.id]={s:'x',on:today(),at:Date.now()}},
  mk:d=>{const u=units(cur()).find(x=>x.id===d.id);if(!u)return;freeze(d.id);parts(u).forEach(p=>{st.log[p.id]={s:'done',on:today(),at:Date.now(),...(p.cv?{cv:p.cv}:{})}});toast('سُجّل ✓ ستُبنى له مراجعات')},
  quick:()=>{
    const n=val('qn').trim(),h=+val('qh'),date=val('qd'),t=val('qt');
    if(!n){msg('اكتب اسم المادة.');return}
    if(!(h>0)){msg('اكتب عدد ساعات المنهج.');return}
    if(!date||date<today()){msg('اختر تاريخ امتحان قادماً.');return}
    st.subjects.push({id:uid(),name:n.slice(0,60),docs:0,color:COL[0],updatedAt:Date.now(),videos:[{id:uid(),n:'المنهج كاملاً',h:Math.min(h,200),p:TY[t].scope[0],updatedAt:Date.now()}],sheets:[],exams:[{id:uid(),t,date,sc:[...TY[t].scope],safety:sfv('qs'),updatedAt:Date.now()}]});
    toast('بُنيت خطتك ✓ يمكنك تفصيلها لاحقاً من المواد');
  },
  freeLog:()=>{if(!st.subjects.length){msg('أضف مادة أولاً.');return}fo=true},
  freeCancel:()=>{fo=false},
  freeSave:()=>{
    const s0=val('fl_sid'),title=val('fl_title').trim(),hours=+val('fl_hours');
    if(!title||!(hours>0)){msg('اكتب الموضوع والساعات.');return}
    st.freeLog[uid()]={sid:s0,title:title.slice(0,80),hours:Math.min(hours,24),on:today(),at:Date.now()};fo=false;
    toast('سُجّلت ✓ المراجعة الأولى: '+sd(add(today(),GAP[0]))+'، ثم تتباعد حسب تقييمك');
  },
  delFree:d=>{delete st.freeLog[d.id];st.dead.push(d.id)},
  exp:async()=>{
    const z=await pack(JSON.stringify(st)),n=Math.ceil(z.length/3800);
    const parts=Array.from({length:n},(_,i)=>'PP1|'+(i+1)+'/'+n+'|'+z.slice(i*3800,(i+1)*3800));
    try{await navigator.clipboard.writeText(parts.join('\n'));toast('تم نسخ '+n+' جزء.')}catch(e){msg('تعذّر النسخ.')}
  },
  imp:async()=>{
    try{
      let t=val('imp').trim();
      const m=[...t.matchAll(/PP1\|(\d+)\/(\d+)\|(\S+)/g)];
      if(m.length){const n=+m[0][2],u={};m.forEach(x=>u[x[1]]=x[3]);if(Object.keys(u).length<n)throw 0;t=Array.from({length:n},(_,i)=>u[i+1]).join('')}
      const o=JSON.parse(await unpack(t));if(!Array.isArray(o.subjects))throw 0;
      ask('استبدال بياناتك الحالية؟',()=>{lsSet('mp3_prev',st);st={...dflt(),...o};norm();noPush=false;save();render();msg('تمت الاستعادة.')});
    }catch(e){msg('النسخة غير صالحة.')}
  },
  /* [28] جزئي: دقائق المنجز تخفض الباقي؛ تأجيل لتاريخ: تعود المهمة في ذلك اليوم */
  /* [30] تجاهل السعة المتعلَّمة: يمسح السجل ليبدأ التعلّم من جديد (الإبقاء على قديمه كان سيُعيد ملء الأصفار) */
  resetCap:()=>{st.actualDays=[];st.capResetAt=today();toast('تم تجاهل السعة المتعلَّمة')},
  part:d=>{tf={id:d.id,m:'p'}},pdate:d=>{tf={id:d.id,m:'d'}},tfx:()=>{tf=null},
  partSave:d=>{const t=findT(d.id),m=Math.round(+val('tf_m'));if(!t||!(m>=1&&m<t.hours*60)){msg('اكتب دقائق أقل من وقت المهمة.');return}freeze(d.id.slice(1).replace(/~\d+$/,''));const o=st.log[d.id],pv=o&&o.s==='part'?o:null;st.log[d.id]={s:'part',on:today(),at:Date.now(),dm:m+((pv&&pv.dm)||0),dt:m+(pv&&pv.on===today()?dtOf(pv):0),minutes_spent:m+(pv?(pv.minutes_spent!=null?pv.minutes_spent:(pv.dm||0)):0)};tf=null;toast('سُجّل ✓ الباقي: '+formatDuration(t.hours-m/60))},
  dateSave:d=>{const to=val('tf_d'),c=Object.values(st.log).filter(e=>e.s==='skip'&&e.on===today()).length;if(!(to>today())){msg('اختر تاريخاً بعد اليوم.');return}if(c>=3){msg('حد الترحيل اليوم: 3 مهام.');return}freeze(d.id.slice(1).replace(/~\d+$/,''));st.log[d.id]={s:'skip',on:today(),to,at:Date.now()};tf=null;toast('أُجّلت إلى '+sd(to))},
  /* [E5] فتح نموذج الإنجاز التفصيلي */
  dtl:d=>{tf={id:d.id,m:'x'}},
  /* [E5] حفظ الإنجاز التفصيلي: pages_done / minutes_spent / hours_done في st.log؛ ما لم يكتمل يبقى متبقيه في الخطة */
  dtlSave:d=>{
    const t=findT(d.id);if(!t)return;
    const tdy=today(),o=st.log[d.id],pv=o&&o.s==='part'?o:null,bid=d.id.slice(1).replace(/~\d+$/,''),mn=Math.round(+val('tf_mn'))||0,ok=val('tf_ok')==='1';
    const pd0=pv?(pv.dm||0):0,mt0=pv?(pv.minutes_spent!=null?pv.minutes_spent:(pv.dm||0)):0,dtp=pv&&pv.on===tdy?dtOf(pv):0;
    if(t.type==='review'){
      if(!ok){tf=null;toast('بقيت المراجعة مستحقة');return}
      const pg=Math.round(+val('tf_pg'))||0,r=RL[val('tf_r')]?val('tf_r'):'good';
      st.log[d.id]={s:'done',on:tdy,at:Date.now(),r,t:t.title,h:mn>0?mn/60:t.hours,sid:t.sid,f:!!t.free,...(mn>0?{minutes_spent:mn}:{}),...(pg>0?{pages_done:pg}:{})};
      tf=null;const nx=Object.entries(buildRevisions(tdy).R).find(([k])=>k.startsWith('R'+d.id.slice(1,d.id.lastIndexOf('_'))+'_'));
      toast(nx?'سُجّل ✓ المراجعة القادمة: '+sd(nx[1].due):'أتقنت هذا الموضوع ✓');return;
    }
    if(t.type==='safe'){
      if(ok){st.log[d.id]={s:'done',on:tdy,at:Date.now(),h:mn>0?mn/60:t.hours,...(mn>0?{minutes_spent:mn}:{})};tf=null;toast('أُنجزت ✓');return}
      if(!(mn>=1&&mn<t.hours*60)){msg('اكتب دقائق أقل من وقت المهمة، أو اختر «نعم».');return}
      st.log[d.id]={s:'part',on:tdy,at:Date.now(),dm:pd0+mn,dt:dtp+mn,minutes_spent:mt0+mn};tf=null;toast('سُجّل ✓ الباقي: '+formatDuration(t.hours-mn/60));return;
    }
    freeze(bid);
    const doneLog=x=>({s:'done',on:tdy,at:Date.now(),...(t.cv?{cv:t.cv}:{}),...x,...(pv&&pv.on!==tdy&&pv.dm?{pd:pv.dm}:{})});
    const Y=t.pgLeft!=null?t.pgLeft:(t.pg||0);
    if(t.k==='s'&&Y>0){
      const X=Math.round(+val('tf_pg'));
      if(!(X>=0&&X<=Y)||!(mn>=1)){msg('اكتب صفحات من 0 إلى '+Y+' ودقائق لا تقل عن 1.');return}
      const pgT=(pv&&pv.pages_done||0)+X,mT=mt0+mn;
      if(X>=Y){st.log[d.id]=doneLog({pages_done:pgT,minutes_spent:mT,m:dtp+mn});toast('أُنجزت ✓')}
      else{st.log[d.id]={s:'part',on:tdy,at:Date.now(),dm:pd0+mn,dt:dtp+mn,pages_done:pgT,minutes_spent:mT};toast('سُجّل ✓ المتبقي: '+(Y-X)+' ص')}
    }else if(t.k==='v'){
      const hw=Math.min(t.hours,+val('tf_hw'));
      if(!(hw>0)){msg('اكتب الساعات التي شاهدتها.');return}
      const mv=Math.max(1,Math.round(hw*60)),hT=(pv&&pv.hours_done||0)+hw,mT=mt0+mv;
      if(ok||hw>=t.hours-1e-9){st.log[d.id]=doneLog({hours_done:hT,minutes_spent:mT,m:dtp+mv});toast('أُنجزت ✓')}
      else{st.log[d.id]={s:'part',on:tdy,at:Date.now(),dm:pd0+mv,dt:dtp+mv,hours_done:hT,minutes_spent:mT};toast('سُجّل ✓ الباقي: '+formatDuration(t.hours-hw))}
    }else{
      if(ok){st.log[d.id]=doneLog(mn>0?{minutes_spent:mt0+mn,m:dtp+mn}:{});toast('أُنجزت ✓')}
      else{
        if(!(mn>=1&&mn<t.hours*60)){msg('اكتب دقائق أقل من وقت المهمة، أو اختر «نعم».');return}
        st.log[d.id]={s:'part',on:tdy,at:Date.now(),dm:pd0+mn,dt:dtp+mn,minutes_spent:mt0+mn};toast('سُجّل ✓ الباقي: '+formatDuration(t.hours-mn/60));
      }
    }
    tf=null;
  },
  /* [E7] تركيز الأسبوع: مادة واحدة +50٪ من نصيبها لمدة 7 أيام، أو «كل المواد» */
  focus:d=>{if(!d.id){delete st.focus;toast('التركيز على كل المواد');return}st.focus={sid:d.id,until:add(today(),6)};toast('تركيز 7 أيام: '+sn(d.id))},
  /* [E10/E11] زيادة الساعات: يُضاف x ساعة لكل يوم دراسة (أيام الراحة تبقى كما هي) */
  raiseHrs:d=>{const x=Math.max(0,+d.x||0);if(!x)return;st.setup.days=st.setup.days.map(h=>h>0?Math.min(18,Math.round((+h+x)*4)/4):h);toast('رُفعت ساعات كل يوم دراسة بمقدار +'+x+' س')},
  /* [E6] خطة التعافي: 3 أيام لا تعلّم جديد فيها، فقط المهام المتأخرة وقت التفعيل */
  recStart:()=>{const ids=P&&P.late?P.late.ids:[];if(!ids.length)return;st.recovery={from:today(),until:add(today(),REC_DAYS-1),ids:[...ids]};toast('بدأت خطة التعافي: '+REC_DAYS+' أيام')},
  recEnd:()=>{delete st.recovery;toast('عادت الخطة العادية')},
  more:()=>{more+=14}
};
const NOSAVE=/^(tab|open|back|edit|exp|imp|more|freeLog|freeCancel|part|pdate|tfx|dtl)$/;
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;
  try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred('light')}catch(x){}
  await A[b.dataset.a](b.dataset);
  if(!NOSAVE.test(b.dataset.a))save();
  render();
  if(fo&&b.dataset.a==='freeLog'){const t=$('#fl_title');t&&t.focus()}
});
document.addEventListener('change',e=>{
  const f=e.target.dataset.f,v=e.target.value;if(!f)return;
  const id=e.target.dataset.id,k=e.target.dataset.k;
  if(f==='name'){if(v.trim()){cur().name=v.trim();tch(cur())}}
  else if(f==='docs'){cur().docs=+v||0;tch(cur())}
  else if(f==='day')st.setup.days[+e.target.dataset.i]=Math.max(0,+v||0);
  else if(f==='pg3')st.setup.pg3=clamp(+v||12,2,60);
  else if(f==='ev'||f==='es'){
    const it=(f==='ev'?cur().videos:cur().sheets).find(x=>x.id===id);if(!it)return;
    if(k==='n'){if(v.trim())it.n=v.trim()}
    else if(k==='p')it.p=v;
    else if(k==='eh'){if(+v>0)it.eh=Math.min(+v,500);else delete it.eh}
    else if(k==='h'||k==='pg'){if(+v>0)it[k]=+v}
    else if(k==='d')it.d=+v>0?clamp(+v,1,5):0;
    else if(k==='sh'){if(v)it.sh=v;else{delete it.sh;delete it.cv}}
    else if(k==='cf'||k==='ct'){const c=it.cv||[0,0];c[k==='cf'?0:1]=Math.max(0,Math.round(+v)||0);it.cv=c}
    tch(cur(),it);
    /* [P2] بعد بدء الدراسة (np مثبّت) تبقى سجلات الأجزاء السابقة بمعرّفاتها؛ وإن كبرت المدة تُضاف أجزاء جديدة */
    if(it.np&&(k==='pg'||k==='h'))toast('تُحفظ سجلات الأجزاء السابقة؛ قد تُضاف أجزاء جديدة إن زادت المدة.');
  }
  else if(f==='sdif'){const n=Math.round(+v);if([2,3,4,5].includes(n))cur().dif=n;else delete cur().dif;tch(cur())}
  else if(f==='esf'){const x=cur().exams.find(q=>q.id===id);if(x){const n=Math.round(+v);x.safety=Number.isFinite(n)?clamp(n,0,SAFETY_MAX):SAFETY_DEF;tch(cur(),x)}}
  else if(f==='eet'){const x=cur().exams.find(q=>q.id===id);if(x){x.t=v;x.sc=[...TY[v].scope];tch(cur(),x)}}
  else if(f==='eed'){const x=cur().exams.find(q=>q.id===id);if(x){x.date=v;tch(cur(),x)}}
  else if(f==='cqb')CFG.qb=v;
  else if(f==='cnotice')CFG.notice=v;
  else return;
  save();keep=true;render();
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.tagName==='DETAILS'&&t.dataset.k)OPN[t.dataset.k]=t.open},true);
load().catch(e=>console.log(e)).then(render);
</script>
