        const g=ag.find(x=>x.sid===sid);if(!g)return;
        let need=hrs*scale;
        while(need>=0.25-1e-9&&room()>=0.25-1e-9){
          const t=g.tasks.find(t=>elig(t,d)&&t.hours<=need+1e-9&&t.hours<=room()+1e-9);
          if(!t)break;
          put(g,t);need-=t.hours;
        }
      });
    }
    /* 0) الحد الأدنى الإلزامي: أقل ما يجب إنجازه اليوم ليبقى كل موعد ممكناً.
       لكل موعد D: ما يُنجز اليوم للمجموعات حتى D ≥ (مجموع متبقيها − السعة الحرة بعد اليوم حتى D). فلا تُظلم المادة الأقرب بسبب القسمة العادلة */
    {const ca=[];let acc=0;for(let j=i+1;j<list.length;j++){const f=list[j].cap-list[j].used;acc+=f>0?Math.floor(f/CH+1e-9)*CH:0;ca[j]=acc} /* السعة القابلة للاستعمال فعلاً بأجزاء كاملة */
     let cumR=0,A=0;
     gs.filter(g=>g.tasks.some(t=>!t.pl)).sort((a,b)=>a.dl<b.dl?-1:a.dl>b.dl?1:0).forEach(g=>{
       cumR+=left(g);const di=g.dl>=last?list.length-1:(pos[g.dl]!=null?pos[g.dl]:list.length-1);
       const m=Math.max(0,cumR-(di>i?ca[di]:0)-A);A+=m;g.mn=m});
     for(const g of ag){while((g.mn||0)>g.gv+1e-9&&room()>=.25-1e-9){const t=first(g,room());if(!t)break;put(g,t)}}}
    /* 1) عند ضيق السعة: لكل مجموعة مهمة واحدة على الأقل بترتيب الأقرب موعداً حتى لا تتوقف مادة */
    if(ag.reduce((a,g)=>a+g.tg,0)>room()+1e-9)for(const g of ag){if(room()<.25-1e-9)break;const t=first(g,room());if(t)put(g,t);
      /* [T20] المادة المُركَّز عليها تأخذ مهمة ثانية في السعة الضيقة */
      if(g.fw>1&&room()>=.25-1e-9&&g.gv+1e-9<g.tg){const t2=first(g,room());if(t2)put(g,t2)}}
    /* 2) كل مجموعة تأخذ نصيبها دوراً بدور (الأقرب أولاً في كل دورة) */
    for(let mv=true;mv&&room()>=.25-1e-9;){mv=false;for(const g of ag){if(g.gv+1e-9>=g.tg)continue;const t=first(g,room());if(t){put(g,t);mv=true;if(room()<.25-1e-9)break}}}
    /* 3) ما تبقّى من السعة للمجموعة الأعلى وتيرة مطلوبة (الأكثر تأخراً)، فيمتلئ اليوم بالتعلّم كاملاً */
    while(room()>=.25-1e-9){
      let bg=null,bt=null,bp=-1;
      for(const g of ag){const t=first(g,room());if(!t)continue;const p=left(g)/g.n*g.fw;if(p>bp+1e-9||(Math.abs(p-bp)<=1e-9&&bg&&g.dl<bg.dl)){bg=g;bt=t;bp=p}}
      if(!bt)break;put(bg,bt);
    }
  }
  const mc=maxDayCap(),uns=learn.filter(t=>!t.pl).map(t=>({...t,date:null,manual:t.hours>mc+1e-9}));
  /* المتأخر الحقيقي: يستثني ما بلا امتحان قادم وما هو أكبر من سعة أي يوم (يحتاج تعديلاً يدوياً) */
  const gapOf=()=>{const g=uns.filter(t=>!t.nx&&!t.manual);return{n:g.length,h:g.reduce((a,t)=>a+t.hours,0),ids:g.map(t=>t.id)}};
  if(sim){const g0=gapOf();return{gap:g0.h,nosf:noSfN.length}}
  all.push(...uns);
  /* [E12] ضمان: كل جزء غير منجز إمّا في all (مجدول) أو في uns؛ أي جزء مفقود يُضاف إلى uns */
  {const have=new Set(all.map(t=>t.id));
   st.subjects.forEach(s=>units(s).forEach(u=>{if(doneOn(u))return;parts(u).forEach(p=>{if(isDone(p.id)||have.has(p.id))return;const t={id:p.id,type:'learn',sid:s.id,title:p.t,hours:p.h,date:null,k:u.k,cv:p.cv,pg:p.pg,...tsc(p),manual:p.h>mc+1e-9,missed:true};uns.push(t);all.push(t);have.add(p.id)})}))}
  /* [E11] نقص الوقت: الحل الوحيد زيادة الساعات؛ تُحسب أقل زيادة يومية (بخطوة نصف ساعة) تُكمل المنهج وتُبقي أيام الأمان */
  const gp=gapOf(),lt=learn.filter(t=>!t.nx),needH=lt.reduce((a,t)=>a+t.hours,0);
  let shortage=null;
  if(gp.h>1e-9||noSfN.length){
    const okAt=k=>{const q=makePlan(t0,{sim:true,extra:k/2});return !!q&&q.gap<=1e-9&&!q.nosf};
    let ex=null;
    if(okAt(16)){let lo=0,hi=16;while(hi-lo>1){const m=(lo+hi)>>1;if(okAt(m))hi=m;else lo=m}ex=hi/2}
    const wd=st.setup.days.filter(x=>x>0),avg=wd.length?wd.reduce((a,b)=>a+b,0)/wd.length:0;
    shortage={need:needH,have:needH-gp.h,gap:gp.h,extra:ex,w:ex==null?null:avg+ex};
  }
  /* [E2] المراجعات المستحقة اليوم تذكير منفصل (الأكثر تأخراً أولاً) ولا تدخل في all ولا تأخذ من السعة */
  const k0=r=>r.due0||r.due;
  const dueRevs=Object.entries(revs).filter(([,r])=>r.due<=t0).map(([id,r])=>({id,type:'review',...r,late:Math.max(0,diff(k0(r),t0))})).sort((a,b)=>k0(a)<k0(b)?-1:k0(a)>k0(b)?1:0);
  const upD=Object.values(revs).filter(r=>r.due>t0).map(r=>r.due).sort();
  return{all,uns,sfUns,noSf:noSfN,feas,revs,mast,act,days:Object.values(days).sort((a,b)=>a.date<b.date?-1:1),dueRevs,upN:upD.length,upFirst:upD[0]||'',shortage,late:{n:gp.n,h:gp.h,total:lt.length,ratio:lt.length?gp.n/lt.length:0,ids:gp.ids},rc,foc};
}

/* [مشكلة1] streak: سجلات «درسته مسبقاً» (pre) لا تُحسب في سلسلة الأيام لأنها ليست التزاماً داخل التطبيق */
function streak(t0){
  const on=new Set(Object.values(st.log).filter(e=>e.s==='done'&&!e.pre).map(e=>e.on));
  Object.values(st.freeLog).forEach(f=>on.add(f.on));
  let d=on.has(t0)?t0:add(t0,-1),n=0;
  while(on.has(d)){n++;d=add(d,-1)}
  return n;
}

const dp=(attrs,v,id)=>`<span class="dp"><input type="text" inputmode="numeric" dir="ltr" maxlength="10" placeholder="DD/MM/YYYY" data-dt ${id?`id="${id}_t"`:''} value="${v?v.split('-').reverse().join('/'):''}">
  <span class="wrap">${ic('cal',19)}<input type="date" data-dn value="${v||''}"></span><input type="hidden" ${attrs} value="${v||''}"></span>`;
const setDt=(w,iso)=>{
  const[y,m,d]=iso.split('-').map(Number);
  if(!(y>=2000)||new Date(y,m-1,d).getMonth()!==m-1){msg('تاريخ غير صحيح.');return}
  const h=w.querySelector('input[type=hidden]');
  w.querySelector('[data-dt]').value=String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'/'+y;
  w.querySelector('[data-dn]').value=iso;
  if(h.value!==iso){h.value=iso;h.dispatchEvent(new Event('change',{bubbles:true}))}
};
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||t.dataset.dt===undefined)return;
  const d=t.value.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/\D/g,'').slice(0,8);
  t.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;
  if(d.length===8)setDt(t.closest('.dp'),d.slice(4)+'-'+d.slice(2,4)+'-'+d.slice(0,2));
},true);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.dn!==undefined){e.stopPropagation();if(t.value)setDt(t.closest('.dp'),t.value)}},true);

  if(P&&P.upN>0&&!P.dueRevs.length){

/* [E6/E10/E11] تنبيهات ظاهرة (ليست داخل details): نقص الوقت = زيادة الساعات فقط، تنبيه المتأخر، وعرض خطة التعافي عند تجاوز 20٪ */

  }

    h+=ban('warn','alert',`<b>منهجك يحتاج ${formatDuration(sh.need)}، لديك ${formatDuration(sh.have)}.</b><br>الفرق: ${formatDuration(sh.gap)}.<br>${btn}`);

  }
  if(!rc&&lt&&lt.total>0&&lt.ratio>REC_RATIO){
    h+=ban('bad','alert',`<b>${lt.n} مهمة متأخرة (${formatDuration(lt.h)})</b><br>خطة التعافي: ${REC_DAYS} أيام لا تعلّم جديد فيها، فقط إنجاز المتأخر.<br><span class="row" style="margin-top:6px"><button class="sm on" data-a="recStart">خطة تعافٍ: ${REC_DAYS} أيام للتعافي</button><button class="sm" data-a="raiseHrs" data-x="${sh&&sh.extra!=null?sh.extra:1}">زيادة الساعات</button></span>`);
  }
  if(P.noSf.length)h+=ban('warn','alert','المنهج أكبر من الوقت. لا أيام أمان: '+esc(P.noSf.join('، '))+'.'+(sh&&sh.extra!=null&&!(sh.gap>1e-9)?/* [إصلاح TIME-6] عرض بالمدة العربية بدل 7.5 */`<br><button class="sm" data-a="raiseHrs" data-x="${sh.extra}" style="margin-top:6px">${ic('plus',14)}ارفع ساعاتك إلى ${formatDuration(sh.w)} يومياً لتعود أيام الأمان</button>`:''));

};
/* [P4/E10] unsH: قوائم تفصيلية لما لم يتسع (التنبيه نفسه ظاهر في unsAlert) */
const unsH=()=>{

/* [P5/E5] taskH: «إنجاز» سريع افتراضي + «إنجاز تفصيلي» اختياري؛ أزرار «الوقت كان» للشيتات والفيديوهات والمراجعات؛ المتبقي بالصفحات يظهر للجزئي */
const taskH=t=>{
  const d=t.st==='done',rv=t.type==='review',col=(sub(t.sid)||{}).color||'var(--au2)';
  /* [T2/T6/T7] النطاق (بارز) + النوع + الثقة للمهام التعليمية */
  const sb=sub(t.sid)||{},lrn=t.type==='learn'&&(t.k==='s'||t.k==='v');
  const sc=lrn&&!d?(t.k==='s'?(t.pf>0?(t.pt>t.pf?`ادرس من ص ${t.pf} إلى ص ${t.pt}`:`ادرس ص ${t.pf}`):''):(t.pn>1?`أكمل الجزء ${t.pi+1} من ${t.pn}`:'أكمل الفيديو')):'';
  const ty=lrn?(t.k==='v'?'فيديو':(t.fmt===.25?'سلايد':'A4')):'',cf=lrn?confL(t.k==='v'?sb.vf_n:sb.mpp_n,t.k==='v'?sb.vf_samples:sb.mpp_samples):'';
  const acts=d?`<button class="sm" data-a="undo" data-id="${t.id}">${ic('undo',14)}تراجع</button>`
      +(rv&&!t.sp&&t.date===today()?`<span class="mu">الوقت كان:</span>`+Object.keys(SPDL).map(r=>`<button class="sm" data-a="spd" data-id="${t.id}" data-r="${r}">${SPDL[r]}</button>`).join(''):'')
    :tmCtl(t)+(rv?Object.keys(RL).map(r=>`<button class="sm" data-a="rate" data-id="${t.id}" data-r="${r}">${RL[r]}</button>`).join('')+`<button class="sm" data-a="dtl" data-id="${t.id}">تفصيلي</button>`
    :`<button class="sm on" data-a="done" data-id="${t.id}">${ic('check',14)}إنجاز</button><button class="sm" data-a="dtl" data-id="${t.id}">إنجاز تفصيلي</button>`+(t.type==='safe'?'':`<button class="sm" data-a="part" data-id="${t.id}">جزئي</button><button class="sm" data-a="skip" data-id="${t.id}">${ic('skip',14)}غداً</button><button class="sm" data-a="pdate" data-id="${t.id}">${ic('cal',14)}تاريخ</button>`));
  /* [T27] شارة الصفحات المغطاة بفيديو لم يُنجَز لمهمة الشيت */
  const covHint=(function(){
    if(t.k!=='s'||d)return '';
    const s=sub(t.sid);if(!s)return '';
    const sheetId=t.id.slice(1).replace(/~\d+$/,'');
    const pend=s.videos.filter(v=>v.sh===sheetId&&!vDone(v,s));
    if(!pend.length)return '';
    /* [إصلاح 9] دمج النطاقات المتداخلة قبل العدّ */
    const cov=covN(mergeRanges(pend.filter(v=>v.cv).map(v=>v.cv)));
    return cov>0?` · ${cov} ص مغطاة بفيديو لم يُنجَز`:'';
  })();
  return `<div class="task ${d?'dn':''}" style="--tc:${col}"><div><span class="tg ${t.type}${t.free?' free':''}">${ic(rv?'repeat':'video',13)}${TL[t.type]}${t.free?' · حر':''}</span>
    <b>${esc(t.title)}</b><small>${esc(sn(t.sid))}${ty?' · '+ty:''} · ${formatDuration(t.hours)}${covHint}${cf?' · '+cf:''}${t.pgLeft!=null?' · المتبقي '+t.pgLeft+' ص':(t.k==='s'&&t.pg>0&&!d?' · '+t.pg+' ص':'')}${t.late>0?' · متأخرة '+ayam(t.late):''}${t.r?' · '+RL[t.r]:''}</small>${sc?`<small style="display:block;font-weight:700;color:var(--fg)">${sc}</small>`:''}${t.over?'<small style="display:block;color:var(--wf)">تتجاوز وقتك اليومي المحدد</small>':''}</div>
    <div class="ac">${acts}</div></div>${tfH(t)}`;
};

/* [E9] خيارات صعوبة المادة (0 = تلقائي) و[E3] خيارات أيام الأمان */
/* [مشكلة2] hmV: قراءة مدة من حقلين Xh (ساعات) و Xm (دقائق) كساعات عشرية: hours + minutes/60 */
const hmV=x=>Math.max(0,+val(x+'h')||0)+Math.max(0,+val(x+'m')||0)/60;
/* [مشكلة2] hmSplit: تفكيك ساعات عشرية إلى {H,M} بالدقائق الصحيحة (1.5 → 1 س 30 د) */
const hmSplit=h=>{const t=Math.round((+h||0)*60);return{H:Math.floor(t/60),M:t%60}};
/* [مشكلة2] hmIn: حقلا ساعات/دقائق متجاوران. attrs يحدد المعرّفات (للإضافة) أو data-f/k/id (للتعديل)؛ ويعرض القيمة الحالية بصيغة «1 س 30 د» */
const hmIn=(attrs,h)=>{const{H,M}=hmSplit(h);

  return `<div class="hm"><input ${a('h')} type="number" min="0" max="${Math.max(23,H)}" step="1" inputmode="numeric" placeholder="ساعات" aria-label="ساعات" value="${H||''}">

function save(){

let seenP=''; /* آخر مؤشر حفظ (slot,count,checksum,t) شوهد في السحابة (قرأناه أو كتبناه): إن اختلف فالسحابة تغيّرت من جهاز آخر. المقارنة بالمؤشر الكامل لا بـ t وحده لأن t قد يتطابق على جهازين */
/* دمج آمن: عند أي استثناء يعيد null فلا تُكتب السحابة ولا تُفقد النسخة المحلية */
const smerge=(a,b)=>{try{return mergeSt(a,b)}catch(e){console.log(e);return null}};
/* [P3] push: يدمج النسخة السحابية قبل الكتابة كلما تغيّرت (m.p!==seenP) وليس فقط حين تكون أحدث بالوقت؛
   ولا يُعلن «متزامنة» إلا إذا انتهت الكتابة فعلاً (sync=!pending). فشل القراءة أو الدمج يُلغي الكتابة بدل الكتابة فوق السحابة. */
async function push(){
  if(!CS||noPush)return;
  if(busy){again=true;return}
  busy=true;
  try{
    let tries=0;
    do{
      again=false;if(++tries>3)break;
      const m=await cget(['p','q','n']);if(!m)throw 0;
      if(m.p&&m.p!==seenP){
        const r=await pull();if(!r.ok)throw 0;
        if(r.data){const mg=smerge(st,r.data);if(!mg)throw 0;st=mg;norm();prune();ver++;lsSet('mp3',st);keep=true;render()}
      }
      const j=await pack(JSON.stringify(st)),t0=st.t,c0=m.p?+m.p.split(',')[0]:1,nw=c0?0:1;
      const ch=j.match(/[\s\S]{1,2000}/g)||[],sum=CHK(j);
      for(let i=0;i<ch.length;i++)await cset('s'+nw+'_'+i,ch[i]);
      if(m.p)await cset('q',m.p);
      const np=nw+','+ch.length+','+sum+','+t0;
      await cset('p',np);
      seenP=np;
      const oq=m.q?+m.q.split(',')[1]:0,rm=[];
      for(let i=ch.length;i<oq;i++)rm.push('s'+nw+'_'+i);
      if(+m.n){rm.push('n');for(let i=0;i<+m.n;i++)rm.push('d'+i)}
      await crem(rm);
      if(st.t===t0&&!again)pending=false;
    }while(again);
    sync=!pending;
  }catch(e){sync=false}
  busy=false;
  if(!pending)try{TG&&TG.disableClosingConfirmation&&TG.disableClosingConfirmation()}catch(e){}
}
function flush(){clearTimeout(tmr);if(pending)push()}
/* [P3] resync: يدمج كلما تغيّرت السحابة (مؤشر الحفظ مختلف عمّا شوهد) لا فقط إن كان t أكبر (ساعات الأجهزة قد تختلف)،
   وإن كان الناتج يختلف عن السحابة يُدفع من جديد */
async function resync(){
  if(!CS||busy||(pending&&!noPush))return;
  const r=await pull();if(!r.ok)return;
  if(r.data&&r.p!==seenP){
    const mg=smerge(st,r.data);if(!mg)return;
    lsSet('mp3_prev',st);st=mg;norm();ver++;lsSet('mp3',st);seenP=r.p;noPush=false;pending=st.t!==r.data.t;render();if(pending)push();
  }
  else if(noPush){noPush=false;if(!r.data){pending=true;push()}}
}

/* [P3/توافق] load: كل المصادر تمر بالتطبيع نفسه داخل mergeSt/norm؛ وفشل الدمج لا يمسح المحلي (يُحفظ الخاسر في mp3_prev) */
/* [T10] load: يقرأ المؤقتات من localStorage أولاً */
async function load(){
  tmLoad();
  const loc=lsGet('mp3');let r={ok:false};
  for(let i=0;i<3&&CS&&!r.ok;i++){r=await pull();if(!r.ok)await new Promise(x=>setTimeout(x,700))}
  const cl=r.data;let m0;
  if(loc&&cl){
    m0=smerge(loc,cl);
    if(!m0){const lw=(loc.t||0)>=(cl.t||0);m0=lw?loc:cl;lsSet('mp3_prev',lw?cl:loc)}
  }else m0=loc||cl||{};
  st={...dflt(),...m0};
  norm();prune();lsSet('mp3',st);
  if(r.ok&&cl)seenP=r.p;
  if(CS){if(!r.ok&&!loc)noPush=true;else if(loc&&(!cl||st.t!==cl.t))pending=true}
  try{const x=await fetch('config.json',{cache:'no-cache'});CFG={...CFG,...await x.json()};lsSet('cfg',CFG)}catch(e){CFG={...CFG,...(lsGet('cfg')||{})}}
  if(pending)push();
}

/* ===== [T3-T13] المؤقت والتعلّم الصامت ===== */
/* tmSave [T10]: حفظ المؤقتات في localStorage بعد كل تغيير */
function tmSave(){try{localStorage.setItem('pp_timers',JSON.stringify(timers))}catch(e){}}
/* tmLoad [T3/T10]: قراءة المؤقتات؛ تُهمل الفاسدة، وبدء في المستقبل (ساعة مغيّرة) يُعاد إلى الآن */
function tmLoad(){
  let o=null;try{o=JSON.parse(localStorage.getItem('pp_timers'))}catch(e){}
  timers={};if(!o||typeof o!=='object'||Array.isArray(o))return;
  const now=Date.now();
  Object.entries(o).forEach(([k,v])=>{if(!v||typeof v!=='object')return;let s0=+v.start>0?+v.start:0;const e=+v.elapsed>0?+v.elapsed:0;if(s0>now+6e4)s0=now;if(!s0&&!e)return;timers[k]={start:s0,elapsed:e,ok:+v.ok>=3?+v.ok:3}});
}
/* elapsedOf: الوقت المتراكم بالمللي ثانية بما فيه الجلسة الجارية */
function elapsedOf(id){const o=timers[id];return o?o.elapsed+(o.start>0?Math.max(0,Date.now()-o.start):0):0}
/* stopActiveTimer [T12]: يوقف المؤقت إن كان يعمل (يضيف الجلسة إلى elapsed) ويعيد الدقائق المتراكمة؛ لا يحذفه */
function stopActiveTimer(id){const o=timers[id];if(!o)return 0;if(o.start>0){o.elapsed+=Math.max(0,Date.now()-o.start);o.start=0}tmSave();return o.elapsed/60000}
/* takeTimer [T12]: يوقف المؤقت ويحذفه ويعيد دقائقه (للأزرار التي تُنهي المهمة أو تؤجلها) */
function takeTimer(id){const m=stopActiveTimer(id);if(timers[id]){delete timers[id];tmSave()}return m}
const fmtT=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(t%60)};
/* confL [T6]: مستوى الثقة من عدد الجلسات المتعلَّمة (العدّاد الكلي، وإلا طول العينات) */
const confL=(n,a)=>{n=+n>0?+n:(Array.isArray(a)?a.length:0);return n<=0?'تقدير مبدئي':n<=2?'ثقة منخفضة':n<=5?'ثقة متوسطة':'ثقة عالية'};
/* med [T13]: الوسيط (لا المتوسط) */
function med(a){const b=[...a].sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):0}
/* learnSheet [T4/T5/T9/T13]: جلسة شيت (صفحات X في mn دقيقة): mpp الفعلي = mn ÷ (X×fmt)؛ خارج 3–60 أو X=0 أو mn<1 لا يُتعلَّم منه.
   يُطبَّع على الصعوبة المتوسطة كي لا تُحتسب الصعوبة مرتين (units تضرب بها)؛ ثم s.mpp = وسيط آخر 5 عينات */
function learnSheet(t,X,mn){
  const s=sub(t.sid);if(!s||!(mn>=1)||!(X>0))return;
  const raw=mn/(X*(+t.fmt||1));if(!(raw>=3&&raw<=60))return;
  const base=raw/((DIF_MULT[t.d]||DIF_MULT[3])/DIF_MULT[3]);
  s.mpp_samples=(s.mpp_samples||[]).concat([+base.toFixed(2)]).filter(x=>x>=3&&x<=60).slice(-5);
  if(!s.mpp_samples.length)return;

function learnVideo(t,cm,mn){

/* tmCheck [T10]: مؤقت يعمل منذ أكثر من 6 ساعات: «حفظ الوقت؟» (الوقت يُحتسب بسقف 3 أضعاف المتوقع) أو تجاهل */
async function tmCheck(){
  if(tmBusy)return;tmBusy=true;
  try{
    for(const id of Object.keys(timers)){
      const o=timers[id],now=Date.now();
      if(!o||!(o.start>0)||now-o.start<=6*36e5)continue;
      const t=findT(id),r=await choose('كان لديك مؤقت على «'+(t?t.title:'مهمة').slice(0,60)+'». هل تريد حفظ الوقت؟','حفظ','تجاهل');
      if(r===null)continue;
      if(r===true&&t){o.elapsed+=Math.min(now-o.start,Math.max(0,3*t.hours*36e5-o.elapsed));o.start=0;tmSave();openTimerDlg(id)}
      else{delete timers[id];tmSave();render()}
    }
  }finally{tmBusy=false}
}

const tmCtl=t=>{
  const o=timers[t.id],id=t.id,clk=`<span class="tg">${ic('clock',13)}<bdi data-tm="${id}">${fmtT(elapsedOf(id))}</bdi></span>`;

function maybeAskCvr(id){
  const t=findT(id);if(!t||t.k!=='v')return;
  const s=sub(t.sid);if(!s)return;
  const v=s.videos.find(x=>x.id===t.id.slice(1).replace(/~\d+$/,''));
  if(!v||v.cv||!v.sh)return;
  /* [إصلاح B] لا تسأل إلا عند اكتمال الفيديو كاملاً (كل الأجزاء أو الكلي) */
  const vidUnit={id:v.id,sid:s.id,p:v.p,k:'v',t:v.n,h:Math.max(.25,v.h*((s&&s.vf>0)?s.vf:1)),np:v.np,hl:hasLogs(v.id)};
  if(!doneOn(vidUnit))return;
  /* يعمل مع الفيديو الكلي والأجزاء */
  const keys=['L'+v.id].concat(Array.from({length:v.np||0},(_,i)=>'L'+v.id+'~'+i));
  const logs=keys.map(k=>st.log[k]).filter(l=>l&&l.s==='done');
  if(!logs.length)return;
  /* منع السؤال إن سبق الإجابة على أي جزء */
  if(keys.some(k=>st.log[k]&&st.log[k].cvr_n!==undefined))return;
  /* المفتاح: الكلي إن وُجد، وإلا آخر جزء منجز */
  const whole=st.log['L'+v.id]&&st.log['L'+v.id].s==='done'?'L'+v.id:null;
  const lastPart=(v.np>1)?('L'+v.id+'~'+(v.np-1)):null;
  const key=whole||((lastPart&&st.log[lastPart]&&st.log[lastPart].s==='done')?lastPart:keys.find(k=>st.log[k]&&st.log[k].s==='done'));
  if(!key)return;
  tf={id:t.id,m:'cvr',key};
  keep=true;
}

A.tick=async()=>{

  if(tmBusy)return;
  const id=Object.keys(timers).find(k=>timers[k]&&timers[k].start>0);if(!id)return;
  const o=timers[id],t=findT(id);if(!t)return;
  const mx=o.ok||3;if(o.elapsed+now-o.start<mx*t.hours*3600000)return;
  tmBusy=true;
  try{
    stopActiveTimer(id);keep=true;render();
    const go=await choose('تجاوزت '+mx+' أضعاف الوقت المتوقع. هل تريد المتابعة؟','نعم، أكمل','لا، أوقف');
    if(go===true){o.ok=mx+3;o.start=Date.now();tmSave();keep=true;render()}
    else openTimerDlg(id);
  }finally{tmBusy=false}
};
const NOSAVE=/^(tab|open|back|edit|exp|imp|more|freeLog|freeCancel|part|pdate|tfx|dtl|stop|timerSkip|fmtNew|delVid|delSh|delSub)$/;
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;
  /* [إصلاح A] لا تُفقد قيم تخصيص اليوم عند أي إجراء آخر (ابدأ/إنجاز/جزئي/غداً/تاريخ/تفصيلي/تراجع/rate/spd/timerSave/dtlSave/undo/skip/freeLog/freeSave/resetCap/raiseHrs/recStart/recEnd/theme) */
  /* [إصلاح TIME-5] فحص ov_caph (المعرّف الجديد) بدل ov_cap */
  if(b.dataset.a!=='ovSave'&&b.dataset.a!=='ovClear'&&document.getElementById('ov_caph'))keep=true;
  try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred('light')}catch(x){}
  await A[b.dataset.a](b.dataset);
  if(!NOSAVE.test(b.dataset.a))save();
  render();
  if(fo&&b.dataset.a==='freeLog'){const t=$('#fl_title');t&&t.focus()}
});
/* [مشكلة2] hmRead: يقرأ حقلَي (ساعات data-u=h، دقائق data-u=m) لنفس العنصر ويعيد ساعات عشرية */
const hmRead=(f,k,id)=>{const q=u=>document.querySelector(`[data-f="${f}"][data-k="${k}"][data-id="${id}"][data-u="${u}"]`),H=q('h'),M=q('m');return Math.max(0,+(H&&H.value)||0)+Math.max(0,+(M&&M.value)||0)/60};
/* [مشكلة1] تبديل ظهور حقول «درسته مسبقاً» عند تفعيل الخانة (بلا إعادة رسم كي لا تضيع القيم المكتوبة) */
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.tg){const b=document.getElementById(t.dataset.tg);if(b)b.style.display=t.checked?'':'none'}});
document.addEventListener('change',e=>{
  /* [T28.7] إظهار/إخفاء قائمة المواد عند تبديل «كل المواد» (قبل شرط f) */
  if(e.target.id==='ov_all'){
    const box=document.getElementById('ov_subs');
    if(box)box.style.display=e.target.checked?'none':'';
  }
  const f=e.target.dataset.f,v=e.target.value;if(!f)return;
  const id=e.target.dataset.id,k=e.target.dataset.k;
  if(f==='name'){if(v.trim()){cur().name=v.trim();tch(cur())}}
  else if(f==='docs'){cur().docs=+v||0;tch(cur())}
  else if(f==='day')st.setup.days[+e.target.dataset.i]=Math.max(0,+v||0);
  else if(f==='pg3')st.setup.pg3=clamp(+v||12,2,60);
  else if(f==='ev'||f==='es'){
    const it=(f==='ev'?cur().videos:cur().sheets).find(x=>x.id===id);if(!it)return;
    if(k==='n'){if(v.trim())it.n=v.trim()}
    else if(k==='p')it.p=v;
    else if(k==='eh'){const t=hmRead(f,k,id);if(t>0)it.eh=Math.min(t,500);else delete it.eh} /* [مشكلة2] ساعات+دقائق */
    else if(k==='h'){const t=hmRead(f,k,id);if(t>0)it.h=Math.min(t,200)} /* [مشكلة2] مدة الفيديو: ساعات+دقائق/60 */
    else if(k==='pg'){if(+v>0)it.pg=+v}
    else if(k==='d')it.d=+v>0?clamp(+v,1,5):0;
    else if(k==='sh'){if(v)it.sh=v;else{delete it.sh;delete it.cv}}
    else if(k==='cf'||k==='ct'){const c=it.cv||[0,0];c[k==='cf'?0:1]=Math.max(0,Math.round(+v)||0);it.cv=c}
    tch(cur(),it);
    /* [P2] بعد بدء الدراسة (np مثبّت) تبقى سجلات الأجزاء السابقة بمعرّفاتها؛ وإن كبرت المدة تُضاف أجزاء جديدة */
    if(it.np&&(k==='pg'||k==='h'))toast('تُحفظ سجلات الأجزاء السابقة؛ قد تُضاف أجزاء جديدة إن زادت المدة.');
  }
  else if(f==='sdif'){const n=Math.round(+v);if([2,3,4,5].includes(n))cur().dif=n;else delete cur().dif;tch(cur())}
  else if(f==='esf'){const x=cur().exams.find(q=>q.id===id);if(x){const n=Math.round(+v);x.safety=Number.isFinite(n)?clamp(n,0,SAFETY_MAX):SAFETY_DEF;tch(cur(),x)}}
  else if(f==='eet'){const x=cur().exams.find(q=>q.id===id);if(x){x.t=v;x.sc=[...TY[v].scope];tch(cur(),x)}}
  else if(f==='eed'){const x=cur().exams.find(q=>q.id===id);if(x){x.date=v;tch(cur(),x)}}
  else if(f==='cqb')CFG.qb=v;
  else if(f==='cnotice')CFG.notice=v;
  else return;
  save();keep=true;render();
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.tagName==='DETAILS'&&t.dataset.k)OPN[t.dataset.k]=t.open},true);
load().catch(e=>console.log(e)).then(render).then(tmCheck).catch(e=>console.log(e));
/* [T3] A.tick كل ثانية: تحديث الوقت في الواجهة + فحص حد 3x */
setInterval(()=>{A.tick().catch(e=>console.log(e))},1000);
</script>
