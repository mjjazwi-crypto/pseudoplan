function uProg(s,id){const u=units(s).find(x=>x.id===id);if(!u)return null;
 const n=Math.max(1,Math.ceil(u.h/PMf())),ph=u.h/n;let dn=0;
 for(let i=0;i<n;i++){const e=st.log['L'+id+'_'+i];if(e&&e.s==='done')dn+=ph;else if(e&&e.s==='part')dn+=Math.min(e.dn||0,ph)}
 return{n,dn,tot:u.h,fr:u.h?dn/u.h:0}}
function snapU(s){return units(s).map(u=>{const p=uProg(s,u.id);if(!p||p.dn<=0)return null;
 const on=[];for(let i=0;i<p.n;i++){const e=st.log['L'+u.id+'_'+i];if(e&&(e.s==='done'||e.s==='part'))on.push(e.on)}
 return{id:u.id,h:u.h,n:p.n,dn:p.dn,fr:p.fr,on:on.sort()[0]||today()}}).filter(Boolean)}
function reapply(s,sn){const us=units(s);
 sn.forEach(x=>{const u=us.find(q=>q.id===x.id);if(!u)return;
  const n=Math.max(1,Math.ceil(u.h/PMf())),ph=u.h/n,tg=x.fr*u.h;if(Math.abs(u.h-x.h)<1e-6&&n===x.n)return;
  for(let i=0;i<Math.max(n,x.n);i++){const k='L'+x.id+'_'+i,e=st.log[k];if(e&&(e.s==='done'||e.s==='part'))delete st.log[k]}
  const full=Math.min(n,Math.floor(tg/ph+1e-6));
  for(let i=0;i<full;i++)st.log['L'+x.id+'_'+i]={s:'done',on:x.on};
  const rem=tg-full*ph;if(full<n&&rem>=.05)st.log['L'+x.id+'_'+full]={s:'part',on:x.on,dn:Math.round(rem*100)/100}})}
